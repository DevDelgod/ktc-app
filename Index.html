<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kafu Tiro Certo</title>
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.postimg.cc/FHyXLm03/LOGO-PRETA-SEM-FUNDO.png">
<link rel="icon" type="image/png" sizes="32x32" href="https://i.postimg.cc/FHyXLm03/LOGO-PRETA-SEM-FUNDO.png">
<link rel="icon" type="image/png" sizes="192x192" href="https://i.postimg.cc/FHyXLm03/LOGO-PRETA-SEM-FUNDO.png">

<meta name="apple-mobile-web-app-title" content="Kafu Tiro Certo">
<meta name="application-name" content="Kafu Tiro Certo">
<meta name="theme-color" content="#f39c12">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="container">
  <div class="header-app">
    <img src="https://i.postimg.cc/FHyXLm03/LOGO-PRETA-SEM-FUNDO.png" class="logo-img">
    <button onclick="document.body.classList.toggle('dark-mode')" style="border:none; background:none; font-size:20px;">🌓</button>
  </div>

  <div id="mini-header" class="training-header" style="display:none;">
    <span id="headerIdTreino">ID: --</span>
    <span id="headerAtleta">Atleta: --</span>
    <span id="headerDataTreino">Data: --</span>
  </div>

  <div class="app-grid">
    <div class="main-section">
      <div class="section-title" style="font-size:15px; margin-top:10px;">Sessão e Ambiente</div>

      <div id="setup-container">
        <div class="form-group">
          <input type="text" id="idTreino" style="width:100%; border:2px solid #2980b9" placeholder="ID do Treino">
        <input type="text" id="atleta" class="w-45" placeholder="Atleta">
        <input type="date" id="dataTreino" class="w-45">

        <select id="tempo" class="w-45">
          <option value="T1">T1</option>
          <option value="T2">T2</option>
        </select>

        <select id="serie" class="w-45">
          <option value="1">Série 1</option>
          <option value="2">Série 2</option>
          <option value="3">Série 3</option>
          <option value="4">Série 4</option>
          <option value="5">Série 5</option>
          <option value="6">Série 6</option>
        </select>

        <select id="clima" style="width:31%">
          <option value="Sol">Sol</option>
          <option value="Sol Extremo">Sol Extremo</option>
          <option value="Nublado">Nublado</option>
          <option value="Chuva">Chuva</option>
          <option value="Chuva Intensa">Chuva Intensa</option>
        </select>

      <select id="distancia" style="width:31%" onchange="verificarDistancia()">
        <option value="18m">18m</option>
        <option value="30m">30m</option>
        <option value="50m">50m</option>
        <option value="70m" selected>70m</option>
      </select>

<select id="tipoAlvo" style="width:31%; display:none;" onchange="desenharAlvo()">
  <option value="indoor_18_single">Alvo Único</option>
  <option value="indoor_18_triplo">Alvo Triplo</option>
</select>

<div style="display: flex; gap: 10px; margin-top: 10px; margin-bottom: 15px;">
  <div style="width: 50%;">
    <label for="qtdSeries">Séries por Rodada (Ex: T1):</label>
    <input type="number" id="qtdSeries" value="6" min="1" max="20" style="width: 100%;" required>
  </div>
  <div style="width: 50%;">
    <label for="qtdFlechas">Flechas por Série:</label>
    <input type="number" id="qtdFlechas" value="6" min="1" max="15" style="width: 100%;" required>
  </div>
</div>

        <input type="number" id="v_vento" style="width:31%" placeholder="Vento Km/h">

        <select id="d_vento" style="width:100%">
          <option value="Norte">Norte</option>
          <option value="Sul">Sul</option>
          <option value="Leste">Leste</option>
          <option value="Oeste">Oeste</option>
          <option value="Nordeste">Nordeste</option>
          <option value="Noroeste">Noroeste</option>
          <option value="Sudeste">Sudeste</option>
          <option value="Sudoeste">Sudoeste</option>
        </select>
        </div>

        <button id="btnStartTraining" class="btn-start" type="button" onclick="ativarTreino()">COMEÇAR</button>
      </div>

      <div id="training-container">
        <div id="moduloAlvo">
          <div class="zoom-controll">
            <input type="range" id="zoomRange" min="300" max="1200" value="500">
          </div>

        <div class="canvas-container">
          <canvas id="alvo" width="300" height="300"></canvas>
        </div>

        <div class="controls">
          <button onclick="desfazer('alvo')" style="flex:1; background:#e74c3c; color:white; border:none; padding:10px; border-radius:8px;">↩ DESFAZER</button>
          <button onclick="limparLocal('alvo')" style="flex:1; background:#f39c12; color:white; border:none; padding:10px; border-radius:8px;">🗑️ LIMPAR</button>
        </div>

        <p style="font-weight:bold" id="contadorAlvo">Flechas no Alvo: 0 / 6</p>
        <button id="btnEnviarAlvo" class="btn-enviar-alvo" onclick="enviarAlvo()">1. CONFIRMAR ALVO</button>
      </div>
      </div>

      <div id="moduloScore" style="display:none;">
      <h3>Pontuação da Série</h3>
      <div id="containerFlechasScore" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
      </div>
  
      <div id="tecladoNumerico"> 
      </div>
        <div class="score-total" id="scoreTotal">Total: 0</div>

        <div class="numpad">
          <button class="num-btn amarelo" onclick="addPonto('X')">X</button>
          <button class="num-btn amarelo" onclick="addPonto('10')">10</button>
          <button class="num-btn vermelho" onclick="addPonto('9')">9</button>
          <button class="num-btn vermelho" onclick="addPonto('8')">8</button>
          <button class="num-btn azul" onclick="addPonto('7')">7</button>
          <button class="num-btn azul" onclick="addPonto('6')">6</button>
          <button class="num-btn preto" onclick="addPonto('5')">5</button>
          <button class="num-btn preto" onclick="addPonto('4')">4</button>
          <button class="num-btn branco" onclick="addPonto('3')">3</button>
          <button class="num-btn branco" onclick="addPonto('2')">2</button>
          <button class="num-btn branco" onclick="addPonto('1')">1</button>
          <button class="num-btn miss" onclick="addPonto('M')">M</button>
        </div>

        <div class="controls">
          <button onclick="desfazer('score')" style="flex:1; background:#e74c3c; color:white; border:none; padding:10px; border-radius:8px;">↩ APAGAR</button>
          <button onclick="limparLocal('score')" style="flex:1; background:#f39c12; color:white; border:none; padding:10px; border-radius:8px;">🗑️ LIMPAR TUDO</button>
        </div>

        <p style="font-weight:bold" id="contadorScore">Pontos Inseridos: 0 / 6</p>
        <button id="btnEnviarScore" class="btn-enviar-score" onclick="enviarScore()">2. FINALIZAR SÉRIE</button>
      </div>

      <p id="status" style="font-size:12px; color:#2980b9; margin-top:10px;"></p>
    </div>

    <div class="side-history">
      <div class="section-title" style="text-align:center">Enviadas</div>
      <div id="listaSeries"></div>
    </div>
  </div>

  <div class="footer-app">© 2026 KafuTiroCerto. Todos os direitos reservados.</div>
</div>

  <script type="module" src="./script.js"></script>
</body>
</html>
